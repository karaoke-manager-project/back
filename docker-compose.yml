services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    #    volumes:
    #      - redis_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  redis_data: